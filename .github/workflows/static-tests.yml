name: 'Static Tests'

# Hermetic tests that read the checked-out tree: no cluster, no secrets, no
# published action refs. They belong on a different trigger from test.yml,
# whose jobs deliberately consume `phase2/octane-actions/actions/*@develop` in
# order to exercise the published ref and therefore only fire on pushes to
# `develop` and `renovate/**`.
#
# That distinction matters: a static test wired into test.yml would never run,
# because `develop` is not part of the current flow (last commit 2024-06-14,
# with main many commits ahead) and every pull request targets `main`.
#
# Deliberately NOT path-filtered. The whole job takes a couple of seconds and
# needs nothing privileged, and an unfiltered workflow reports a real
# conclusion on every pull request instead of silently not running, which is
# what you want if any of these ever becomes a required check.

on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:

  drupal-security-update-pr-body:
    name: drupal-security-update PR body assembly
    runs-on: self-hosted
    container:
      image: ghcr.io/phase2/docker-cli:php8.4
      # Default actions must run as user 1000
      options: --user 1000
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          # This test executes a shell block it reads out of action.yml, so
          # leave no token in .git/config for that code to find.
          persist-credentials: false
      - name: Test PR body assembly
        run: bash actions/drupal-security-update/test-pr-body.sh

  soc-check-actions:
    name: require-checks and attest-check logic
    runs-on: self-hosted
    container:
      image: ghcr.io/phase2/docker-cli:php8.4
      # Default actions must run as user 1000
      options: --user 1000
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test gate evaluation and evidence rendering
        run: node --test --test-reporter=spec actions/require-checks/test-evaluate.js actions/attest-check/test-render.js
